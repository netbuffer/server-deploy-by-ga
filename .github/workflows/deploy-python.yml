    inputs:
      git_repo_url:
        description: 'Git SSH 地址 (留空则默认使用 Secrets 中的 GIT_REPO_URL)'
        required: false
        default: ''
      git_ref:
        description: 'Git 分支 / Tag / Commit (默认: main)'
        required: false
